<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Inscrição para Entrevista</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@400;700&family=Lexend:wght@400;700&display=swap" rel="stylesheet">
</head>
<body>

<div class="container">
    <div class="header">
        <h1>Inscrição para Entrevista</h1>
        <p>Master Educação</p>
    </div>

    <form id="formInscricao">
        <div class="input-group">
            <label for="nomeCompleto">Nome completo</label>
            <input type="text" id="nomeCompleto" class="input-field" placeholder="Seu nome completo" required>
        </div>

        <div class="input-group">
            <label for="cpf">CPF</label>
            <input type="text" id="cpf" class="input-field" maxlength="14" placeholder="000.000.000-00" required>
            <span id="cpfMessage" class="field-message"></span>
        </div>

        <div class="input-group">
            <label for="email">E-mail</label>
            <input type="email" id="email" class="input-field" placeholder="seu@email.com" required>
        </div>

        <div class="input-group">
            <label for="telefone">Telefone</label>
            <input type="text" id="telefone" class="input-field" maxlength="15" placeholder="(82) 9.0000-0000" required>
        </div>

        <div class="input-group">
            <label>Quais dias da semana você tem disponibilidade?</label>
            <div class="checkbox-grid">
                <label class="checkbox-container"><input type="checkbox" name="dia" value="terca"><span class="checkmark"></span>Terça</label>
                <label class="checkbox-container"><input type="checkbox" name="dia" value="quarta"><span class="checkmark"></span>Quarta</label>
                <label class="checkbox-container"><input type="checkbox" name="dia" value="quinta"><span class="checkmark"></span>Quinta</label>
                <label class="checkbox-container"><input type="checkbox" name="dia" value="sexta"><span class="checkmark"></span>Sexta</label>
            </div>
        </div>

        <div class="input-group">
            <label>Quais horários funcionam para você?</label>
            <div class="checkbox-grid">
                <label class="checkbox-container"><input type="checkbox" name="horario" value="10h"><span class="checkmark"></span>10h</label>
                <label class="checkbox-container"><input type="checkbox" name="horario" value="10h30"><span class="checkmark"></span>10h30</label>
                <label class="checkbox-container"><input type="checkbox" name="horario" value="15h"><span class="checkmark"></span>15h</label>
                <label class="checkbox-container"><input type="checkbox" name="horario" value="15h30"><span class="checkmark"></span>15h30</label>
                <label class="checkbox-container"><input type="checkbox" name="horario" value="16h"><span class="checkmark"></span>16h</label>
            </div>
        </div>

        <div id="submitError" class="submit-error hidden"></div>

        <button type="submit" class="btn btn-submit" id="btnSubmit">Enviar Inscrição</button>
    </form>

    <div id="successBox" class="success-box hidden">
        <h2>Inscrição enviada! ✅</h2>
        <p>Obrigado! Em breve entraremos em contato para confirmar o horário da entrevista.</p>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="config.js"></script>
<script src="script.js"></script>
</body>
</html>
